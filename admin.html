<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrar catálogo</title>
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel Admin">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0d; --panel:#14141b; --panel-2:#1b1b23; --line:#2a2a33; --line-soft:#1f1f27;
  --gold-1:#f4e6b8; --gold-2:#d9b45a; --gold-3:#b8893a; --gold-deep:#8a6522;
  --gold-grad:linear-gradient(135deg,#f4e6b8,#e6c76b 30%,#c99a3e 60%,#f4e6b8);
  --cream:#f2ecdf; --muted:#8f8a7a; --muted-2:#6a6659; --ok:#7bd88f; --danger:#e0796b;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1000px 520px at 50% -12%, var(--panel) 0%, transparent 60%), var(--bg); color:var(--cream); font-family:'Jost',system-ui,sans-serif; min-height:100vh}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; color:var(--cream); padding:10px 12px; font-size:.9rem; outline:none}
input:focus,select,textarea:focus{border-color:var(--gold-3)}
label{font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-3); display:block; margin-bottom:6px}
img{display:block;max-width:100%}

/* Login */
.login{min-height:100vh; display:grid; place-items:center; padding:20px}
.login .box{width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:32px 26px}
.login h1{font-family:'Cinzel',serif; text-align:center; margin-bottom:6px; font-size:1.4rem}
.login p{text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:22px}
.login .field{margin-bottom:14px}
.btn{background:var(--gold-grad); color:#0a0a0d; font-weight:600; padding:12px 18px; border-radius:10px; font-size:.9rem}
.btn:hover{filter:brightness(1.05)}
.btn.full{width:100%}
.btn.ghost{background:var(--panel-2); border:1px solid var(--line); color:var(--cream); font-weight:500}
.btn.danger{background:none; border:1px solid var(--danger); color:var(--danger); font-weight:500}
.err{color:var(--danger); font-size:.82rem; margin-top:8px; text-align:center}

/* App */
.app{max-width:1000px; margin:0 auto; padding:20px}
.bar{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.bar h2{font-family:'Cormorant Garamond',serif; font-size:1.7rem; margin-right:auto}
.tabs{display:flex; gap:6px; background:var(--panel); padding:4px; border-radius:12px}
.tab{padding:9px 16px; border-radius:9px; color:var(--muted); font-size:.86rem}
.tab.active{background:var(--gold-grad); color:#0a0a0d; font-weight:500}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px}
.field{margin-bottom:14px}
.hint{font-size:.76rem; color:var(--muted); margin:-6px 0 10px}
.check{display:flex; align-items:center; gap:9px; margin-bottom:12px}
.check input{width:auto}
.check label{margin:0; text-transform:none; letter-spacing:0; color:var(--cream); font-size:.88rem}

.list{display:flex; flex-direction:column; gap:10px}
.item{display:flex; gap:12px; align-items:center; background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:11px 13px}
.item .th{width:48px; height:48px; border-radius:9px; overflow:hidden; background:var(--panel-2); flex:0 0 auto; display:grid; place-items:center; color:var(--gold-deep); font-family:'Cormorant Garamond',serif}
.item .th img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1; min-width:0}
.item .n{font-weight:500}
.item .sub{font-size:.76rem; color:var(--muted)}
.tg{display:inline-block; font-size:.66rem; padding:2px 8px; border-radius:999px; border:1px solid var(--gold-deep); color:var(--gold-2); margin-left:6px}
.tg.off{border-color:var(--muted-2); color:var(--muted-2)}
.item .acts{display:flex; gap:8px}
.iconbtn{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); display:grid; place-items:center; font-size:.9rem}
.iconbtn:hover{border-color:var(--gold-3)}

/* Overlay form */
.ov{position:fixed; inset:0; z-index:60; background:rgba(4,4,6,.75); backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center; overflow-y:auto; padding:24px 14px}
.ov.open{display:flex}
.modal{width:100%; max-width:600px; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px}
.modal h3{font-family:'Cormorant Garamond',serif; font-size:1.5rem; margin-bottom:18px}
.pres-row{display:grid; grid-template-columns:1fr 1fr 1fr auto auto; gap:8px; align-items:center; margin-bottom:8px}
.pres-row .chk{display:grid; place-items:center}
.pres-row .chk input{width:20px;height:20px}
.pres-row .del{color:var(--danger); font-size:1.2rem; padding:0 4px}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.np{padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); color:var(--muted); font-size:.82rem}
.np.sel{border-color:var(--gold-2); color:var(--gold-1); background:rgba(184,137,58,.12)}
.imgs{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px}
.imgs .im{position:relative; width:64px; height:64px; border-radius:9px; overflow:hidden; border:1px solid var(--line)}
.imgs .im img{width:100%;height:100%;object-fit:cover}
.imgs .im button{position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:6px; background:rgba(0,0,0,.6); color:#fff; font-size:.9rem; display:grid; place-items:center}
.modal .actions{display:flex; gap:10px; margin-top:20px}
.subfield{margin-top:12px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--gold-deep); color:var(--cream); padding:12px 20px; border-radius:999px; font-size:.86rem; opacity:0; pointer-events:none; transition:.3s; z-index:90}

/* Ventas: resumen, stock y días */
.sech{font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-3); margin:18px 0 10px}
.stats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px}
.stat{flex:1; min-width:130px; background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:12px 14px}
.stat .k{font-size:.72rem; color:var(--muted)} .stat .v{font-size:1.3rem; color:var(--gold-1); font-family:'Cormorant Garamond',serif; margin-top:2px}
.stockgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:6px}
.stk-item{display:flex; justify-content:space-between; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line-soft); border-radius:10px; padding:8px 11px; font-size:.85rem}
.stk-item .qt{font-weight:600}
.stk-item.out{border-color:var(--danger)} .stk-item.out .qt{color:var(--danger)}
.stk-item.low{border-color:var(--gold-deep)} .stk-item.low .qt{color:var(--gold-2)}
.stk-item.ok .qt{color:var(--ok)}
.dayhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:16px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line-soft)}
.dayhead span:first-child{text-transform:capitalize; color:var(--gold-1); font-family:'Cormorant Garamond',serif; font-size:1.05rem}
.dayhead span:last-child{color:var(--muted); font-size:.8rem}
.toast.show{opacity:1}
.toast.bad{border-color:var(--danger)}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:1fr}.bar h2{font-size:1.4rem}.pres-row{grid-template-columns:1fr 1fr 1fr auto auto}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="box">
    <h1 class="gold-text" style="background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent">Panel Admin</h1>
    <p id="loginStore"></p>
    <div class="field"><label>Correo</label><input id="email" type="email" placeholder="tucorreo@ejemplo.com"></div>
    <div class="field"><label>Contraseña</label><input id="password" type="password" placeholder="••••••••"></div>
    <button class="btn full" id="loginBtn">Ingresar</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" style="display:none">
  <div class="bar">
    <h2 id="storeTitle">Catálogo</h2>
    <div class="tabs">
      <button class="tab active" data-tab="productos">Productos</button>
      <button class="tab" data-tab="notas">Notas</button>
      <button class="tab" data-tab="promos">Promociones</button>
      <button class="tab" data-tab="combos">Combos</button>
      <button class="tab" data-tab="ventas">Ventas</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
    </div>
    <button class="btn ghost" id="installBtn" style="display:none">⤓ Instalar app</button>
    <button class="btn danger" id="logout">Salir</button>
  </div>

  <section id="tab-productos">
    <div class="bar"><button class="btn" id="newProd">+ Nuevo producto</button></div>
    <div class="list" id="listProd"></div>
  </section>

  <section id="tab-notas" style="display:none">
    <div class="bar"><button class="btn" id="newNota">+ Nueva nota</button></div>
    <div class="list" id="listNotas"></div>
  </section>

  <section id="tab-promos" style="display:none">
    <div class="bar"><button class="btn" id="newPromo">+ Nueva promoción</button></div>
    <div class="list" id="listPromos"></div>
  </section>

  <section id="tab-combos" style="display:none">
    <div class="bar"><button class="btn" id="newCombo">+ Nuevo combo</button></div>
    <div class="list" id="listCombos"></div>
  </section>

  <section id="tab-ventas" style="display:none">
    <div class="bar"><h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem">Ventas e inventario</h3><button class="btn" id="newVenta" style="margin-left:auto">+ Registrar venta</button></div>
    <div id="ventasResumen"></div>
    <div id="ventasStock"></div>
    <div class="list" id="listVentas"></div>
  </section>

  <section id="tab-ajustes" style="display:none">
    <div class="bar"><h3 style="font-family:'Cormorant Garamond',serif;font-size:1.4rem">Ajustes del catálogo</h3></div>
    <div class="field"><label>Frase de bienvenida (debajo del nombre)</label><textarea id="aHero" rows="2" placeholder="Ej. Decants y fragancias seleccionadas..."></textarea><div class="hint">Aparece en la portada del catálogo, debajo del nombre grande.</div></div>
    <div class="field"><label>Mensaje de agradecimiento (comprobante impreso)</label><textarea id="aGracias" rows="2" placeholder="Ej. ¡Gracias por tu compra!"></textarea><div class="hint">Se imprime al final del comprobante de venta.</div></div>
    <div class="actions"><button class="btn" id="saveAjustes">Guardar ajustes</button></div>
  </section>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
/* Aplica los colores de CONFIG.TEMA sobre las variables del diseño */
(function(){ if(!window.CONFIG||!CONFIG.TEMA) return; var t=CONFIG.TEMA, r=document.documentElement;
  Object.keys(t).forEach(function(k){ if(t[k]) r.style.setProperty('--'+k, t[k]); });
  if(!t['gold-grad'] && t['gold-1'] && t['gold-3'])
    r.style.setProperty('--gold-grad','linear-gradient(135deg,'+t['gold-1']+' 0%,'+(t['gold-2']||t['gold-3'])+' 30%,'+t['gold-3']+' 60%,'+t['gold-1']+' 100%)');
  var m=document.querySelector('meta[name="theme-color"]'); if(m&&t['bg']) m.setAttribute('content', t['bg']);
})();
</script>
<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const BUCKET = CONFIG.BUCKET || 'catalogo';
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MLS = ['3','5','10','30','Sellado'];
$('#loginStore').textContent = CONFIG.TIENDA_NOMBRE;
$('#storeTitle').textContent = CONFIG.TIENDA_NOMBRE;

let PRODUCTOS=[], NOTAS=[], REL=[], PROMOS=[], VENTAS=[], AJUSTES={};

/* ============ Auth ============ */
async function checkSession(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) showApp();
}
function showApp(){ $('#login').style.display='none'; $('#app').style.display='block'; boot(); }
async function login(){
  const email=$('#email').value.trim(), password=$('#password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ $('#loginErr').textContent = 'No se pudo ingresar. Revisa tu correo/contraseña.'; return; }
  showApp();
}
$('#loginBtn').onclick = login;
$('#password').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
$('#logout').onclick = async()=>{ await sb.auth.signOut(); location.reload(); };

/* ============ Tabs ============ */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active');
  $('#tab-productos').style.display = t.dataset.tab==='productos'?'block':'none';
  $('#tab-notas').style.display    = t.dataset.tab==='notas'?'block':'none';
  $('#tab-promos').style.display   = t.dataset.tab==='promos'?'block':'none';
  $('#tab-combos').style.display   = t.dataset.tab==='combos'?'block':'none';
  $('#tab-ventas').style.display   = t.dataset.tab==='ventas'?'block':'none';
  $('#tab-ajustes').style.display  = t.dataset.tab==='ajustes'?'block':'none';
});

/* ============ Carga ============ */
async function boot(){ await Promise.all([loadNotas(), loadProductos(), loadPromos(), loadCombos(), loadVentas(), loadAjustes()]); renderVentas(); }

async function loadAjustes(){
  const {data}=await sb.from('ajustes').select('*').eq('id','principal').maybeSingle();
  AJUSTES = data || {};
  renderAjustes();
}
function renderAjustes(){
  const h=$('#aHero'), g=$('#aGracias');
  if(h) h.value = (AJUSTES&&AJUSTES.hero_sub) || CONFIG.HERO_SUB || '';
  if(g) g.value = (AJUSTES&&AJUSTES.mensaje_gracias) || CONFIG.MENSAJE_GRACIAS || '';
}
async function saveAjustes(){
  const payload={ id:'principal', hero_sub:$('#aHero').value.trim()||null, mensaje_gracias:$('#aGracias').value.trim()||null };
  const {error}=await sb.from('ajustes').upsert(payload);
  if(error){ toast('Error: '+error.message,true); return; }
  AJUSTES=payload; toast('Ajustes guardados ✓');
}
async function loadNotas(){ const {data}=await sb.from('notas').select('*').order('nombre'); NOTAS=data||[]; renderNotas(); }
async function loadPromos(){ const {data}=await sb.from('promociones').select('*').order('created_at',{ascending:false}); PROMOS=data||[]; renderPromos(); }
async function loadProductos(){
  const {data}=await sb.from('productos').select('*').order('orden').order('created_at',{ascending:false});
  PRODUCTOS=data||[];
  const {data:rel}=await sb.from('producto_notas').select('*'); REL=rel||[];
  renderProductos();
}
async function uploadImg(file, folder){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${folder}/${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true});
  if(error){ toast('Error subiendo imagen: '+error.message,true); return null; }
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
function presActivas(p){ return (p.presentaciones||[]).filter(x=>x&&Number(x.precio)>0); }
function notasDe(pid){ return REL.filter(r=>r.producto_id===pid).map(r=>NOTAS.find(n=>n.id===r.nota_id)).filter(Boolean); }
function imgsOf(p){ const a=Array.isArray(p.imagenes)?p.imagenes.filter(Boolean):[]; return a.length?a:(p.imagen_url?[p.imagen_url]:[]); }
function mlLabel(ml){ return String(ml).toLowerCase()==='sellado'?'Sellado':ml+'ml'; }

/* ============ PRODUCTOS ============ */
function renderProductos(){
  if(!PRODUCTOS.length){ $('#listProd').innerHTML='<div class="hint">Aún no hay productos. Crea el primero.</div>'; return; }
  $('#listProd').innerHTML = PRODUCTOS.map(p=>{
    const img=imgsOf(p)[0]; const pres=presActivas(p);
    return `<div class="item">
      <div class="th">${img?`<img src="${esc(img)}">`:esc((p.marca||p.nombre||'?')[0])}</div>
      <div class="info">
        <div class="n">${esc(p.nombre)} ${p.destacado?'<span class="tg">Destacado</span>':''} ${p.visible===false?'<span class="tg off">Oculto</span>':''}</div>
        <div class="sub">${esc(p.marca||'')} · ${esc(p.categoria||'')} · ${esc(p.genero||'')} · ${pres.length} presentación${pres.length!==1?'es':''}${p.stock!=null?` · Stock: ${p.stock}`:''}</div>
      </div>
      <div class="acts">
        <button class="iconbtn" data-edit="${p.id}">✏️</button>
        <button class="iconbtn" data-del="${p.id}">🗑️</button>
      </div>
    </div>`;
  }).join('');
  $('#listProd').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>prodForm(b.dataset.edit));
  $('#listProd').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delProd(b.dataset.del));
}

function prodForm(id){
  const p = id ? PRODUCTOS.find(x=>x.id===id) : {};
  let imgs = imgsOf(p).slice();
  let pres = (p.presentaciones && p.presentaciones.length) ? JSON.parse(JSON.stringify(p.presentaciones)) : [{ml:'5',precio:'',antes:'',activo:true},{ml:'10',precio:'',antes:'',activo:true}];
  let selNotas = new Set(notasDe(id).map(n=>n.id));
  const cats=CONFIG.CATEGORIAS||['Árabe','Diseñador','Nicho'];
  const gens=CONFIG.GENEROS||['Hombre','Mujer','Unisex'];

  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nuevo'} producto</h3>
    <div class="grid2">
      <div class="field"><label>Marca</label><input id="pMarca" value="${esc(p.marca||'')}"></div>
      <div class="field"><label>Nombre</label><input id="pNombre" value="${esc(p.nombre||'')}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Categoría</label><select id="pCat">${cats.map(c=>`<option ${p.categoria===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>Género</label><select id="pGen">${gens.map(g=>`<option ${p.genero===g?'selected':''}>${esc(g)}</option>`).join('')}</select></div>
      <div class="field"><label>Orden</label><input id="pOrden" type="number" value="${p.orden??0}"></div>
    </div>
    <div class="field"><label>Descripción corta</label><input id="pDesc" value="${esc(p.descripcion||'')}" placeholder="Ej. Fresco, amaderado, elegante"></div>

    <div class="field"><label>Stock (unidades)</label><input id="pStock" type="number" min="0" value="${p.stock??''}" placeholder="Vacío = sin límite"><div class="hint">Vacío = no controlar stock · 0 = agotado · N = unidades disponibles. Se muestra en el catálogo.</div></div>

    <div class="field"><label>Imágenes</label>
      <input id="pFiles" type="file" accept="image/*" multiple>
      <div class="imgs" id="imgList"></div>
    </div>

    <div class="field"><label>Presentaciones (talla · precio · antes · ✓ visible)</label>
      <div class="hint">Marca ✓ para mostrarla. "antes" es opcional (precio tachado). Usa "Sellado" para botella completa.</div>
      <div id="presList"></div>
      <div class="chips" style="margin-top:8px">${MLS.map(m=>`<button class="np" data-addml="${m}">+ ${mlLabel(m)}</button>`).join('')}</div>
    </div>

    <div class="field"><label>Notas aromáticas (biblioteca)</label>
      <div class="chips" id="notasPick">${NOTAS.length?NOTAS.map(n=>`<button class="np ${selNotas.has(n.id)?'sel':''}" data-nota="${n.id}">${esc(n.nombre)}</button>`).join(''):'<span class="hint">No hay notas aún. Créalas en la pestaña Notas.</span>'}</div>
    </div>

    <div class="grid3">
      <div class="field"><label>Notas de salida</label><input id="pSalida" value="${esc(p.notas_salida||'')}"></div>
      <div class="field"><label>Notas de corazón</label><input id="pCorazon" value="${esc(p.notas_corazon||'')}"></div>
      <div class="field"><label>Notas de fondo</label><input id="pFondo" value="${esc(p.notas_fondo||'')}"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>Duración</label><input id="pLong" value="${esc(p.longevidad||'')}" placeholder="Ej. 8-10 h"></div>
      <div class="field"><label>Estela</label><input id="pEstela" value="${esc(p.estela||'')}" placeholder="Ej. Moderada"></div>
      <div class="field"><label>Ocasión</label><input id="pOcasion" value="${esc(p.ocasion||'')}" placeholder="Ej. Noche"></div>
    </div>

    <div class="check"><input type="checkbox" id="pDest" ${p.destacado?'checked':''}><label for="pDest">Destacado (aparece con etiqueta)</label></div>
    <div class="check"><input type="checkbox" id="pVis" ${p.visible!==false?'checked':''}><label for="pVis">Visible en el catálogo</label></div>

    <div class="actions">
      <button class="btn" id="saveProd">${id?'Guardar cambios':'Crear producto'}</button>
      <button class="btn ghost" id="cancelProd">Cancelar</button>
    </div>`;

  function renderImgs(){
    $('#imgList').innerHTML = imgs.map((u,i)=>`<div class="im"><img src="${esc(u)}"><button data-rmimg="${i}">×</button></div>`).join('');
    $('#imgList').querySelectorAll('[data-rmimg]').forEach(b=>b.onclick=()=>{ imgs.splice(+b.dataset.rmimg,1); renderImgs(); });
  }
  renderImgs();
  $('#pFiles').onchange = async e => {
    const files=[...e.target.files]; if(!files.length)return;
    toast('Subiendo imágenes...');
    for(const f of files){ const u=await uploadImg(f,'productos'); if(u) imgs.push(u); }
    renderImgs(); toast('Imágenes subidas');
  };

  function renderPres(){
    $('#presList').innerHTML = pres.map((x,i)=>`
      <div class="pres-row">
        <input data-pml="${i}" value="${esc(x.ml)}" placeholder="talla">
        <input data-pprecio="${i}" type="number" step="0.01" value="${x.precio??''}" placeholder="precio">
        <input data-pantes="${i}" type="number" step="0.01" value="${x.antes??''}" placeholder="antes">
        <div class="chk"><input type="checkbox" data-pact="${i}" ${x.activo!==false?'checked':''}></div>
        <button class="del" data-pdel="${i}">×</button>
      </div>`).join('');
    $('#presList').querySelectorAll('[data-pml]').forEach(el=>el.oninput=()=>pres[+el.dataset.pml].ml=el.value);
    $('#presList').querySelectorAll('[data-pprecio]').forEach(el=>el.oninput=()=>pres[+el.dataset.pprecio].precio=el.value);
    $('#presList').querySelectorAll('[data-pantes]').forEach(el=>el.oninput=()=>pres[+el.dataset.pantes].antes=el.value);
    $('#presList').querySelectorAll('[data-pact]').forEach(el=>el.onchange=()=>pres[+el.dataset.pact].activo=el.checked);
    $('#presList').querySelectorAll('[data-pdel]').forEach(el=>el.onclick=()=>{ pres.splice(+el.dataset.pdel,1); renderPres(); });
  }
  renderPres();
  document.querySelectorAll('[data-addml]').forEach(b=>b.onclick=()=>{ pres.push({ml:b.dataset.addml,precio:'',antes:'',activo:true}); renderPres(); });

  $('#notasPick').querySelectorAll('[data-nota]').forEach(b=>b.onclick=()=>{
    const nid=b.dataset.nota; if(selNotas.has(nid))selNotas.delete(nid); else selNotas.add(nid);
    b.classList.toggle('sel');
  });

  // Auto-seleccionar notas de la biblioteca según lo escrito en salida/corazón/fondo
  function normNota(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
  function autoSelectNotas(){
    const txt=[$('#pSalida').value,$('#pCorazon').value,$('#pFondo').value].join(',');
    const tokens=txt.split(/[,;/·|\n]+/).map(normNota).filter(Boolean);
    NOTAS.forEach(n=>{
      const nn=normNota(n.nombre); if(nn.length<2) return;
      const hit=tokens.some(t=> t===nn || (nn.length>=3 && t.includes(nn)) );
      if(hit && !selNotas.has(n.id)){
        selNotas.add(n.id);
        const btn=$('#notasPick').querySelector(`[data-nota="${n.id}"]`);
        if(btn) btn.classList.add('sel');
      }
    });
  }
  ['#pSalida','#pCorazon','#pFondo'].forEach(sel=>{ const el=$(sel); if(el) el.addEventListener('input', autoSelectNotas); });
  autoSelectNotas();

  $('#cancelProd').onclick = closeOv;
  $('#saveProd').onclick = async () => {
    const nombre=$('#pNombre').value.trim(); if(!nombre){ toast('Ponle un nombre',true); return; }
    const presLimpio = pres.filter(x=>String(x.ml).trim() && Number(x.precio)>0)
      .map(x=>({ml:String(x.ml).trim(), precio:Number(x.precio), antes:x.antes?Number(x.antes):null, activo:x.activo!==false}));
    const payload = {
      marca:$('#pMarca').value.trim(), nombre, categoria:$('#pCat').value, genero:$('#pGen').value,
      orden:parseInt($('#pOrden').value)||0, descripcion:$('#pDesc').value.trim(),
      stock: $('#pStock').value.trim()===''? null : (parseInt($('#pStock').value)||0),
      imagenes:imgs, imagen_url:imgs[0]||null, presentaciones:presLimpio,
      notas_salida:$('#pSalida').value.trim()||null, notas_corazon:$('#pCorazon').value.trim()||null, notas_fondo:$('#pFondo').value.trim()||null,
      longevidad:$('#pLong').value.trim()||null, estela:$('#pEstela').value.trim()||null, ocasion:$('#pOcasion').value.trim()||null,
      destacado:$('#pDest').checked, visible:$('#pVis').checked,
    };
    let pid=id, error;
    if(id){ ({error}=await sb.from('productos').update(payload).eq('id',id)); }
    else { const r=await sb.from('productos').insert(payload).select().single(); error=r.error; pid=r.data?.id; }
    if(error){ toast('Error: '+error.message,true); return; }
    // Relaciones de notas
    if(pid){
      await sb.from('producto_notas').delete().eq('producto_id',pid);
      const rows=[...selNotas].map(nid=>({producto_id:pid, nota_id:nid}));
      if(rows.length) await sb.from('producto_notas').insert(rows);
    }
    toast('Guardado ✓'); closeOv(); loadProductos();
  };
  openOv();
}

async function delProd(id){
  if(!confirm('¿Eliminar este producto?')) return;
  const {error}=await sb.from('productos').delete().eq('id',id);
  if(error){ toast('Error: '+error.message,true); return; }
  toast('Eliminado'); loadProductos();
}

/* ============ PROMOCIONES ============ */
const PROMO_TIPOS = [
  ['producto','🏷️','Descuento a productos','% off a productos/tallas elegidos'],
  ['cantidad','🔢','Precio por cantidad','Llevando N o más, precio fijo o %'],
  ['combo','🎁','Combo / pack','N a elección por un precio total fijo'],
  ['regalo','🎀','Regalo por compra','Llevando N decants, elige un decant gratis'],
  ['general','🌐','Descuento general','% a todo el catálogo o una categoría'],
];
function tipoLabel(t){ const x=PROMO_TIPOS.find(p=>p[0]===t); return x?x[2]:t; }

function renderPromos(){
  if(!PROMOS.length){ $('#listPromos').innerHTML='<div class="hint">Sin promociones. Crea descuentos, combos o precios por cantidad.</div>'; return; }
  $('#listPromos').innerHTML = PROMOS.map(p=>`
    <div class="item">
      <div class="th">${(PROMO_TIPOS.find(t=>t[0]===p.tipo)||['','🏷️'])[1]}</div>
      <div class="info"><div class="n">${esc(p.nombre)} ${p.activo?'':'<span class="tg off">Inactiva</span>'}</div><div class="sub">${esc(tipoLabel(p.tipo))}${p.desde||p.hasta?` · ${p.desde||'…'} → ${p.hasta||'…'}`:''}</div></div>
      <div class="acts"><button class="iconbtn" data-edit="${p.id}">✏️</button><button class="iconbtn" data-del="${p.id}">🗑️</button></div>
    </div>`).join('');
  $('#listPromos').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>promoForm(b.dataset.edit));
  $('#listPromos').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delPromo(b.dataset.del));
}

function promoForm(id){
  const p = id?PROMOS.find(x=>x.id===id):{tipo:'producto',activo:true,config:{}};
  let tipo=p.tipo||'producto';
  const c=p.config||{};

  function prodPickHTML(sel){
    const s=new Set(sel||[]);
    return `<div class="chips" id="promoProds">${PRODUCTOS.map(pr=>`<button type="button" class="np ${s.has(pr.id)?'sel':''}" data-p="${pr.id}">${esc(pr.nombre)}</button>`).join('')}</div><div class="hint">Vacío = aplica a todos.</div>`;
  }
  function mlPickHTML(sel){
    const s=new Set((sel||[]).map(String));
    return `<div class="chips" id="promoMls">${MLS.map(m=>`<button type="button" class="np ${s.has(m)?'sel':''}" data-m="${m}">${mlLabel(m)}</button>`).join('')}</div><div class="hint">Vacío = todas las tallas.</div>`;
  }
  function catPickHTML(sel){
    const cats=CONFIG.CATEGORIAS||[];
    return `<div class="subfield"><label>Categoría (opcional)</label><select id="pf_cat2"><option value="todas" ${(!sel||sel==='todas')?'selected':''}>Todas</option>${cats.map(x=>`<option ${sel===x?'selected':''}>${esc(x)}</option>`).join('')}</select><div class="hint">Ej. solo "Árabe" para una promo de árabes.</div></div>`;
  }
  function regaloProdsHTML(sel){
    const s=new Set(sel||[]);
    return `<div class="chips" id="promoRegalo">${PRODUCTOS.map(pr=>`<button type="button" class="np ${s.has(pr.id)?'sel':''}" data-r="${pr.id}">${esc(pr.nombre)}</button>`).join('')}</div><div class="hint">El cliente podrá elegir su regalo SOLO entre estos perfumes. (Si dejas vacío, no habrá opciones.)</div>`;
  }

  function bodyFor(t){
    if(t==='producto') return `
      <div class="subfield"><label>Productos</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="subfield"><label>% de descuento</label><input id="pf_pct" type="number" value="${c.pct??''}" placeholder="Ej. 15"></div>`;
    if(t==='cantidad') return `
      <div class="subfield"><label>Productos</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="grid3">
        <div class="subfield"><label>Mínimo (N)</label><input id="pf_min" type="number" value="${c.min??''}" placeholder="Ej. 2"></div>
        <div class="subfield"><label>Modo</label><select id="pf_modo"><option value="precio_fijo" ${c.modo==='precio_fijo'?'selected':''}>Precio fijo c/u</option><option value="pct" ${c.modo==='pct'?'selected':''}>% descuento</option></select></div>
        <div class="subfield"><label>Valor</label><input id="pf_valor" type="number" step="0.01" value="${c.valor??''}" placeholder="S/ o %"></div>
      </div>`;
    if(t==='combo') return `
      <div class="subfield"><label>Productos elegibles</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas</label>${mlPickHTML(c.mls)}</div>
      <div class="grid2">
        <div class="subfield"><label>¿Cuántos entran?</label><input id="pf_cant" type="number" value="${c.cantidad??''}" placeholder="Ej. 2"></div>
        <div class="subfield"><label>Precio total S/</label><input id="pf_total" type="number" step="0.01" value="${c.precio_total??''}" placeholder="Ej. 30"></div>
      </div>`;
    if(t==='regalo') return `
      <div class="subfield"><label>¿Qué decants cuentan para el regalo?</label>${prodPickHTML(c.productos)}</div>
      ${catPickHTML(c.categoria)}
      <div class="subfield"><label>Tallas que cuentan</label>${mlPickHTML(c.mls)}</div>
      <div class="grid2">
        <div class="subfield"><label>¿Cuántos decants para 1 regalo? (N)</label><input id="pf_gmin" type="number" value="${c.min??''}" placeholder="Ej. 2"></div>
        <div class="subfield"><label>Talla del regalo</label><input id="pf_gml" value="${esc(c.regalo_ml||'')}" placeholder="Ej. 2"><div class="hint">Ej. 2 = decant de 2ml. Usa "Sellado" si aplica.</div></div>
      </div>
      <div class="subfield"><label>Perfumes que el cliente puede elegir como regalo</label>${regaloProdsHTML(c.regalo_productos)}</div>
      <div class="hint">Ejemplo: "Llevando 2 decants de 5ml, elige 1 decant de 2ml de regalo". Por cada N que lleve, gana 1 regalo.</div>`;
    return `
      <div class="subfield"><label>Alcance</label><select id="pf_alcance"><option value="todo" ${c.alcance==='todo'?'selected':''}>Todo el catálogo</option><option value="categoria" ${c.alcance==='categoria'?'selected':''}>Una categoría</option></select></div>
      <div class="subfield" id="pf_catwrap" style="display:${c.alcance==='categoria'?'block':'none'}"><label>Categoría</label><select id="pf_cat">${(CONFIG.CATEGORIAS||[]).map(x=>`<option ${c.categoria===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="subfield"><label>% de descuento</label><input id="pf_pct" type="number" value="${c.pct??''}" placeholder="Ej. 10"></div>`;
  }

  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nueva'} promoción</h3>
    <div class="field"><label>Nombre</label><input id="prNombre" value="${esc(p.nombre||'')}" placeholder="Ej. 2 árabes de 5ml x S/32"></div>
    <div class="field"><label>Tipo</label>
      <div class="chips" id="tipoPick">${PROMO_TIPOS.map(t=>`<button type="button" class="np ${tipo===t[0]?'sel':''}" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join('')}</div>
    </div>
    <div id="promoBody">${bodyFor(tipo)}</div>
    <div class="grid2" style="margin-top:12px">
      <div class="field"><label>Desde (opcional)</label><input id="prDesde" type="date" value="${p.desde||''}"></div>
      <div class="field"><label>Hasta (opcional)</label><input id="prHasta" type="date" value="${p.hasta||''}"></div>
    </div>
    <div class="check"><input type="checkbox" id="prActivo" ${p.activo!==false?'checked':''}><label for="prActivo">Activa</label></div>
    <div class="actions"><button class="btn" id="savePromo">${id?'Guardar':'Crear'}</button><button class="btn ghost" id="cancelPromo">Cancelar</button></div>`;

  function bindPickers(){
    const bodyEl=$('#promoBody');
    bodyEl.querySelectorAll('#promoProds [data-p]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
    bodyEl.querySelectorAll('#promoMls [data-m]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
    bodyEl.querySelectorAll('#promoRegalo [data-r]').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));
    const alc=bodyEl.querySelector('#pf_alcance');
    if(alc) alc.onchange=()=>{ bodyEl.querySelector('#pf_catwrap').style.display=alc.value==='categoria'?'block':'none'; };
  }
  bindPickers();
  $('#tipoPick').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
    tipo=b.dataset.t; document.querySelectorAll('#tipoPick .np').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    $('#promoBody').innerHTML=bodyFor(tipo); bindPickers();
  });

  function getChecked(wrapId,attr){ return [...document.querySelectorAll(`#${wrapId} .np.sel`)].map(el=>el.dataset[attr]); }
  function buildConfig(){
    const cat2=()=>{ const el=$('#pf_cat2'); return el&&el.value!=='todas'?el.value:null; };
    if(tipo==='producto') return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), pct:+$('#pf_pct').value||0 };
    if(tipo==='cantidad') return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), min:+$('#pf_min').value||0, modo:$('#pf_modo').value, valor:+$('#pf_valor').value||0 };
    if(tipo==='combo')    return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), cantidad:+$('#pf_cant').value||0, precio_total:+$('#pf_total').value||0 };
    if(tipo==='regalo')   return { productos:getChecked('promoProds','p'), categoria:cat2(), mls:getChecked('promoMls','m'), min:+$('#pf_gmin').value||0, regalo_ml:$('#pf_gml').value.trim(), regalo_productos:getChecked('promoRegalo','r') };
    const alc=$('#pf_alcance').value; return { alcance:alc, categoria:alc==='categoria'?$('#pf_cat').value:null, pct:+$('#pf_pct').value||0 };
  }

  $('#cancelPromo').onclick=closeOv;
  $('#savePromo').onclick = async () => {
    const nombre=$('#prNombre').value.trim(); if(!nombre){ toast('Ponle nombre',true); return; }
    const config=buildConfig();
    if(tipo==='regalo'){
      if(!(config.min>0)){ toast('Indica cuántos decants se necesitan (N)',true); return; }
      if(!config.regalo_ml){ toast('Indica la talla del regalo (ej. 2)',true); return; }
      if(!config.regalo_productos.length){ toast('Marca al menos un perfume que el cliente pueda elegir de regalo',true); return; }
    }
    const payload={ nombre, tipo, config, desde:$('#prDesde').value||null, hasta:$('#prHasta').value||null, activo:$('#prActivo').checked };
    const {error}= id ? await sb.from('promociones').update(payload).eq('id',id) : await sb.from('promociones').insert(payload);
    if(error){ toast('Error: '+error.message,true); return; }
    toast('Guardado ✓'); closeOv(); loadPromos();
  };
  openOv();
}
async function delPromo(id){ if(!confirm('¿Eliminar esta promoción?'))return; const {error}=await sb.from('promociones').delete().eq('id',id); if(error){toast('Error: '+error.message,true);return;} toast('Eliminada'); loadPromos(); }

/* ============ COMBOS / PROMOCIONES ============ */

async function loadCombos(){ const {data}=await sb.from('combos').select('*').order('orden').order('created_at',{ascending:false}); COMBOS=data||[]; renderCombos(); }
function tallasDe(c){ return (c.tallas||[]).filter(t=>t&&String(t.ml).trim()); }
function renderCombos(){

      <div class="info">
        <div class="n">${esc(c.nombre)} ${c.destacado?'<span class="tg">Destacado</span>':''} ${c.visible===false?'<span class="tg off">Oculto</span>':''}</div>

        <button class="iconbtn" data-del="${c.id}">🗑️</button>

  let tallas = (c.tallas && c.tallas.length) ? JSON.parse(JSON.stringify(c.tallas))
    : [{ml:'3',sprays:'50',precio:'',antes:'',mas_vendido:false,activo:true},{ml:'5',sprays:'90',precio:'',antes:'',mas_vendido:true,activo:true},{ml:'10',sprays:'180',precio:'',antes:'',mas_vendido:false,activo:true}];
  let addons = (c.addons && c.addons.length) ? JSON.parse(JSON.stringify(c.addons)) : [];
  const incluyeTxt = (Array.isArray(c.incluye)?c.incluye:[]).join('\n');

  $('#modal').innerHTML = `
    <h3>${id?'Editar':'Nuevo'} combo</h3>
    <div class="field"><label>Nombre del combo</label><input id="cNombre" value="${esc(c.nombre||'')}" placeholder="Ej. ROMPE CUELLOS"></div>

async function delCombo(id){ if(!confirm('¿Eliminar este combo?'))return; const {error}=await sb.from('combos').delete().eq('id',id); if(error){toast('Error: '+error.message,true);return;} toast('Combo eliminado'); loadCombos(); }

/* ============ VENTAS ============ */
const VENTA_ESTADOS = ['nuevo','confirmado','entregado','cancelado'];
function fmtV(n){ return (CONFIG.MONEDA||'S/')+' '+Number(n||0).toFixed(2); }
function fechaCorta(iso){ try{ return new Date(iso).toLocaleString('es-PE',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return iso||''; } }
function diaKey(iso){ try{ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }catch(e){ return ''; } }
function fechaDia(iso){ try{ return new Date(iso).toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){ return iso||''; } }
function horaCorta(iso){ try{ return new Date(iso).toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function estSel(cur,e){ return (cur||'nuevo')===e?'selected':''; }

async function loadVentas(){
  const {data,error}=await sb.from('ventas').select('*').order('created_at',{ascending:false});
  VENTAS = error ? [] : (data||[]);
  renderVentas();
}
function renderVentas(){
  // --- Resumen ---
  const hoy=diaKey(new Date().toISOString());
  const mes=hoy.slice(0,7);
  const ventasHoy=VENTAS.filter(v=>diaKey(v.created_at)===hoy).length;
  const ventasMes=VENTAS.filter(v=>diaKey(v.created_at).slice(0,7)===mes).length;
  const nuevos=VENTAS.filter(v=>(v.estado||'nuevo')==='nuevo').length;
  const ingresos=VENTAS.filter(v=>['confirmado','entregado'].includes(v.estado)).reduce((s,v)=>s+Number(v.total||0),0);
  const res=$('#ventasResumen');
  if(res) res.innerHTML=`<div class="stats">
    <div class="stat"><div class="k">Ventas hoy</div><div class="v">${ventasHoy}</div></div>
    <div class="stat"><div class="k">Ventas del mes</div><div class="v">${ventasMes}</div></div>
    <div class="stat"><div class="k">Ingresos confirmados</div><div class="v">${fmtV(ingresos)}</div></div>
    <div class="stat"><div class="k">Pedidos nuevos</div><div class="v">${nuevos}</div></div>
  </div>`;

  // --- Stock disponible ---
  const bajo=CONFIG.STOCK_BAJO||5;
  const conStock=PRODUCTOS.filter(p=>p.stock!=null).slice().sort((a,b)=>Number(a.stock)-Number(b.stock));
  const st=$('#ventasStock');
  if(st){
    st.innerHTML=`<div class="sech">Stock disponible</div>`+(conStock.length?
      `<div class="stockgrid">${conStock.map(p=>{ const s=Number(p.stock); const cls=s<=0?'out':(s<=bajo?'low':'ok'); return `<div class="stk-item ${cls}"><span class="nm">${esc(p.nombre)}</span><span class="qt">${s<=0?'Agotado':s}</span></div>`; }).join('')}</div>`
      : `<div class="hint">Ningún producto tiene stock definido todavía.</div>`)
      + `<div class="hint">Los productos sin stock definido no se controlan (venta ilimitada).</div>`;
  }

  // --- Historial de ventas por día ---
  if(!VENTAS.length){ $('#listVentas').innerHTML='<div class="sech">Historial de ventas</div><div class="hint">Aún no hay ventas registradas. Cuando un cliente pida (o registres una venta), aparecerá aquí.</div>'; return; }
  const grupos={};
  VENTAS.forEach(v=>{ const k=diaKey(v.created_at); (grupos[k] ||= []).push(v); });
  const dias=Object.keys(grupos).sort((a,b)=>b.localeCompare(a));
  let html='<div class="sech">Historial de ventas</div>';
  dias.forEach(k=>{
    const arr=grupos[k];
    const totalDia=arr.reduce((s,v)=>s+Number(v.total||0),0);
    html+=`<div class="dayhead"><span>${esc(fechaDia(arr[0].created_at))}</span><span>${arr.length} venta${arr.length!==1?'s':''} · ${fmtV(totalDia)}</span></div>`;
    html+=arr.map(v=>{
      const it=v.items||[]; const n=it.reduce((s,x)=>s+(+x.qty||0),0); const est=v.estado||'nuevo';
      return `<div class="item">
        <div class="th">🧾</div>
        <div class="info">
          <div class="n">${esc(v.cliente_nombre||'Sin nombre')} <span class="tg ${est==='cancelado'?'off':''}">${esc(est)}</span></div>
          <div class="sub">${horaCorta(v.created_at)} · ${n} art. · ${fmtV(v.total)}${v.cliente_telefono?` · ${esc(v.cliente_telefono)}`:''}</div>
        </div>
        <div class="acts">
          <button class="iconbtn" data-print="${v.id}">🖨️</button>
          <button class="iconbtn" data-edit="${v.id}">✏️</button>
          <button class="iconbtn" data-del="${v.id}">🗑️</button>
        </div>
      </div>`;
    }).join('');
  });
  $('#listVentas').innerHTML=html;
  $('#listVentas').querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>imprimirVenta(b.dataset.print));
  $('#listVentas').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>ventaForm(b.dataset.edit));
  $('#listVentas').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>delVenta(b.dataset.del));
}

    <div class="grid2">

      <div class="field"><label>Teléfono</label><input id="vTel" value="${esc(v.cliente_telefono||'')}"></div>
    </div>
    <div class="field"><label>Dirección / referencia</label><input id="vDir" value="${esc(v.cliente_direccion||'')}"></div>
    <div class="field"><label>Nota del cliente</label><input id="vNota" value="${esc(v.cliente_nota||'')}"></div>

    <div class="field"><label>Artículos del pedido</label><div id="ventaItems">${itemsHtml}</div></div>

    <div class="grid3">
      <div class="field"><label>Subtotal</label><input id="vSub" type="number" step="0.01" value="${v.subtotal??''}"></div>
      <div class="field"><label>Descuento</label><input id="vDescu" type="number" step="0.01" value="${v.descuento??''}"></div>
      <div class="field"><label>Total</label><input id="vTotal" type="number" step="0.01" value="${v.total??''}"></div>
    </div>
    <div class="field"><label>Estado</label><select id="vEstado">${VENTA_ESTADOS.map(e=>`<option ${estSel(v.estado,e)}>${e}</option>`).join('')}</select><div class="hint">Al marcar <b>confirmado</b> o <b>entregado</b> se descuenta el stock. Si la pasas a <b>cancelado/nuevo</b>, el stock se devuelve.${v.stock_descontado?' <span style="color:var(--ok)">· stock ya descontado</span>':''}</div></div>
    <div class="field"><label>Notas internas (solo tú las ves)</label><textarea id="vInternas" rows="2">${esc(v.notas_internas||'')}</textarea></div>

    <div class="actions">
      <button class="btn" id="saveVenta">Guardar cambios</button>
      <button class="btn ghost" id="printVenta">🖨️ Imprimir</button>
      <button class="btn ghost" id="cancelVenta">Cancelar</button>
    </div>`;
  $('#cancelVenta').onclick=closeOv;
  $('#printVenta').onclick=()=>imprimirVenta(id);
  $('#saveVenta').onclick=async()=>{
    const num=el=>el.value===''?null:Number(el.value);
    const nuevoEstado=$('#vEstado').value;
    const DEDUCT=['confirmado','entregado'];
    let stockDesc=!!v.stock_descontado, extra='';
    try{
      if(DEDUCT.includes(nuevoEstado) && !stockDesc){ await ajustarStockDeVenta(v.items,-1); stockDesc=true; extra=' · stock descontado'; }
      else if(!DEDUCT.includes(nuevoEstado) && stockDesc){ await ajustarStockDeVenta(v.items,+1); stockDesc=false; extra=' · stock devuelto'; }
    }catch(e){ console.warn('stock', e); }
    const payload={
      cliente_nombre:$('#vNombre').value.trim()||null,
      cliente_telefono:$('#vTel').value.trim()||null,
      cliente_direccion:$('#vDir').value.trim()||null,
      cliente_nota:$('#vNota').value.trim()||null,
      subtotal:num($('#vSub')), descuento:num($('#vDescu')), total:num($('#vTotal')),
      estado:nuevoEstado, notas_internas:$('#vInternas').value.trim()||null,
      stock_descontado:stockDesc,
    };
    const {error}=await sb.from('ventas').update(payload).eq('id',id);
    if(error){ toast('Error: '+error.message,true); return; }
    toast('Venta actualizada ✓'+extra); closeOv(); await loadProductos(); loadVentas();
  };
  openOv();
}

// Ajusta el stock de los productos de una venta. sign=-1 descuenta, +1 devuelve.
async function ajustarStockDeVenta(items, sign){
  const map={};
  (items||[]).forEach(it=>{ const pid=it.id||it.producto_id; if(pid) map[pid]=(map[pid]||0)+(Number(it.qty)||0); });
  const ids=Object.keys(map); if(!ids.length) return;
  const {data}=await sb.from('productos').select('id,stock').in('id',ids);
  for(const p of (data||[])){
    if(p.stock===null||p.stock===undefined) continue;   // producto sin control de stock
    let nuevo=Number(p.stock)+sign*map[p.id];
    if(nuevo<0) nuevo=0;
    await sb.from('productos').update({stock:nuevo}).eq('id',p.id);
  }
}

      ${(v.subtotal!=null&&Number(v.descuento)>0)?`<div class="row"><span>Subtotal</span><span>${fmtV(v.subtotal)}</span></div>`:''}
      ${Number(v.descuento)>0?`<div class="row"><span>Descuento</span><span>- ${fmtV(v.descuento)}</span></div>`:''}
      <div class="row big"><span>Total</span><span>${fmtV(v.total)}</span></div>
    </div>
    <div class="gracias">${esc(gracias)}</div>
    <div class="pie">${CONFIG.WHATSAPP?('WhatsApp: '+esc(CONFIG.WHATSAPP)):''}</div>
    <script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script>
  </body></html>`);
  w.document.close();
}
async function delVenta(id){ if(!confirm('¿Eliminar esta venta del registro?'))return; const {error}=await sb.from('ventas').delete().eq('id',id); if(error){toast('Error: '+error.message,true);return;} toast('Venta eliminada'); loadVentas(); }

// Registrar una venta manualmente desde el panel
function ventaManualForm(){
  function presDe(pid){ const p=PRODUCTOS.find(x=>x.id===pid); return (p?.presentaciones||[]).filter(x=>x&&String(x.ml).trim()); }
  function firstPres(pid){ return presDe(pid)[0]||null; }
  let mitems=[];
  if(PRODUCTOS.length){ const pid=PRODUCTOS[0].id; const fp=firstPres(pid); mitems.push({pid, ml:fp?String(fp.ml):'', precio:fp?fp.precio:'', qty:1}); }

  $('#modal').innerHTML=`
    <h3>Registrar venta</h3>
    <div class="grid2">
      <div class="field"><label>Nombre del cliente</label><input id="mNombre" placeholder="Opcional"></div>
      <div class="field"><label>Teléfono</label><input id="mTel" placeholder="Opcional"></div>
    </div>
    <div class="field"><label>Dirección / referencia</label><input id="mDir" placeholder="Opcional"></div>

    <div class="field"><label>Productos vendidos</label>
      ${PRODUCTOS.length?'<div id="mItems"></div><div class="chips" style="margin-top:8px"><button class="np" id="mAdd">+ Agregar producto</button></div>':'<div class="hint">No tienes productos aún. Crea productos primero en la pestaña Productos.</div>'}
    </div>

    <div class="grid3">
      <div class="field"><label>Subtotal</label><input id="mSub" type="number" step="0.01" readonly></div>
      <div class="field"><label>Descuento</label><input id="mDescu" type="number" step="0.01" value="0"></div>
      <div class="field"><label>Total</label><input id="mTotal" type="number" step="0.01" readonly></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Método de pago</label><select id="mPago"><option value="efectivo">Efectivo</option><option value="yape">Yape</option><option value="transferencia">Transferencia</option><option value="coordinar">Coordinar</option></select></div>
      <div class="field"><label>Estado</label><select id="mEstado">${VENTA_ESTADOS.map(e=>`<option ${e==='confirmado'?'selected':''}>${e}</option>`).join('')}</select></div>
    </div>
    <div class="hint">Si la registras como <b>confirmado</b> o <b>entregado</b>, se descuenta del stock automáticamente.</div>

    <div class="actions">
      <button class="btn" id="saveVentaM">Registrar venta</button>
      <button class="btn ghost" id="cancelVentaM">Cancelar</button>
    </div>`;

  function recalc(){
    const sub=mitems.reduce((s,x)=>s+(Number(x.qty)||0)*(Number(x.precio)||0),0);
    const des=Number($('#mDescu').value)||0;
    if($('#mSub')) $('#mSub').value=sub.toFixed(2);
    if($('#mTotal')) $('#mTotal').value=Math.max(0,sub-des).toFixed(2);
  }
  function renderMItems(){
    const box=$('#mItems'); if(!box) return;
    box.innerHTML=mitems.map((x,i)=>{
      const ps=presDe(x.pid);
      return `<div class="pres-row" style="grid-template-columns:1.5fr 1fr .6fr .8fr auto">
        <select data-mp="${i}">${PRODUCTOS.map(p=>`<option value="${p.id}" ${p.id===x.pid?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select>
        <select data-mml="${i}">${ps.length?ps.map(pp=>`<option value="${esc(String(pp.ml))}" ${String(pp.ml)===String(x.ml)?'selected':''}>${esc(mlLabel(pp.ml))} · ${fmtV(pp.precio)}</option>`).join(''):'<option value="">—</option>'}</select>
        <input data-mqty="${i}" type="number" min="1" value="${x.qty}" title="Cantidad">
        <input data-mprice="${i}" type="number" step="0.01" value="${x.precio}" title="Precio unit.">
        <button class="del" data-mdel="${i}">×</button>
      </div>`;
    }).join('');
    box.querySelectorAll('[data-mp]').forEach(el=>el.onchange=()=>{ const i=+el.dataset.mp; mitems[i].pid=el.value; const fp=firstPres(el.value); mitems[i].ml=fp?String(fp.ml):''; mitems[i].precio=fp?fp.precio:''; renderMItems(); recalc(); });
    box.querySelectorAll('[data-mml]').forEach(el=>el.onchange=()=>{ const i=+el.dataset.mml; mitems[i].ml=el.value; const pp=presDe(mitems[i].pid).find(z=>String(z.ml)===el.value); if(pp) mitems[i].precio=pp.precio; renderMItems(); recalc(); });
    box.querySelectorAll('[data-mqty]').forEach(el=>el.oninput=()=>{ mitems[+el.dataset.mqty].qty=el.value; recalc(); });
    box.querySelectorAll('[data-mprice]').forEach(el=>el.oninput=()=>{ mitems[+el.dataset.mprice].precio=el.value; recalc(); });
    box.querySelectorAll('[data-mdel]').forEach(el=>el.onclick=()=>{ mitems.splice(+el.dataset.mdel,1); if(!mitems.length){ const pid=PRODUCTOS[0]?.id||''; const fp=firstPres(pid); mitems.push({pid,ml:fp?String(fp.ml):'',precio:fp?fp.precio:'',qty:1}); } renderMItems(); recalc(); });
  }
  if(PRODUCTOS.length){ renderMItems(); recalc(); }
  const addBtn=$('#mAdd'); if(addBtn) addBtn.onclick=()=>{ const pid=PRODUCTOS[0]?.id||''; const fp=firstPres(pid); mitems.push({pid,ml:fp?String(fp.ml):'',precio:fp?fp.precio:'',qty:1}); renderMItems(); recalc(); };
  const dEl=$('#mDescu'); if(dEl) dEl.oninput=recalc;

  $('#cancelVentaM').onclick=closeOv;
  $('#saveVentaM').onclick=async()=>{
    const items=mitems
      .filter(x=>x.pid && (Number(x.qty)||0)>0 && (Number(x.precio)||0)>0)
      .map(x=>{ const p=PRODUCTOS.find(pp=>pp.id===x.pid)||{}; const qty=Number(x.qty)||1, precio=Number(x.precio)||0;
        return { id:x.pid, nombre:p.nombre||'', marca:p.marca||'', ml:String(x.ml||''), qty, precio, total:qty*precio }; });
    if(!items.length){ toast('Agrega al menos un producto con precio y cantidad',true); return; }
    const subtotal=items.reduce((s,i)=>s+i.total,0);
    const descuento=Number($('#mDescu').value)||0;
    const total=Math.max(0,subtotal-descuento);
    const estado=$('#mEstado').value;
    const deduct=['confirmado','entregado'].includes(estado);
    const payload={ cliente_nombre:$('#mNombre').value.trim()||null, cliente_telefono:$('#mTel').value.trim()||null,
      cliente_direccion:$('#mDir').value.trim()||null, items, subtotal, descuento, total,
      metodo_pago:$('#mPago').value, estado, stock_descontado:deduct };
    const {error}=await sb.from('ventas').insert(payload);
    if(error){ toast('Error: '+error.message,true); return; }
    if(deduct){ try{ await ajustarStockDeVenta(items,-1); }catch(e){ console.warn('stock',e); } }
    toast('Venta registrada ✓'); closeOv(); await loadProductos(); loadVentas();
  };
  openOv();
}

/* ============ Overlay + acciones ============ */
function openOv(){ $('#ov').classList.add('open'); document.body.style.overflow='hidden'; }
function closeOv(){ $('#ov').classList.remove('open'); document.body.style.overflow=''; }
$('#newProd').onclick=()=>prodForm(null);
$('#newNota').onclick=()=>notaForm(null);
$('#newPromo').onclick=()=>promoForm(null);
if($('#newCombo')) $('#newCombo').onclick=()=>comboForm(null);
if($('#newVenta')) $('#newVenta').onclick=()=>ventaManualForm();
if($('#saveAjustes')) $('#saveAjustes').onclick=saveAjustes;

let tt; function toast(m,bad){ const t=$('#toast'); t.textContent=m; t.className='toast show'+(bad?' bad':''); clearTimeout(tt); tt=setTimeout(()=>t.className='toast',2600); }

checkSession();
</script>
