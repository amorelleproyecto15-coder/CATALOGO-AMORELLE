<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aromelle — Decants de Perfumes</title>
<meta name="theme-color" content="#0a0a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ====================================================================
   ⚙️  CONFIGURACIÓN — cambia estos 4 valores (también más abajo en JS)
   ==================================================================== */
:root{
  --bg:#0a0a0d; --bg-2:#101015; --panel:#14141b; --panel-2:#1b1b23;
  --line:#2a2a33; --line-soft:#1f1f27;
  --gold-1:#f4e6b8; --gold-2:#d9b45a; --gold-3:#b8893a; --gold-deep:#8a6522;
  --gold-grad:linear-gradient(135deg,#f4e6b8 0%,#e6c76b 30%,#c99a3e 60%,#f4e6b8 100%);
  --cream:#f2ecdf; --muted:#8f8a7a; --muted-2:#6a6659;
  --ok:#7bd88f; --danger:#e0796b;
  --radius:14px; --radius-lg:20px;
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 600px at 50% -10%, #16130c 0%, transparent 60%),
    var(--bg);
  color:var(--cream); font-family:'Jost',system-ui,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
img{display:block; max-width:100%}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
::selection{background:var(--gold-3); color:#0a0a0d}

.gold-text{
  background:var(--gold-grad); -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
}
.eyebrow{
  font-size:.7rem; letter-spacing:.32em; text-transform:uppercase;
  color:var(--gold-3); font-weight:500;
}

/* ---------- Filigrana dorada (firma de marca) ---------- */
.flourish{display:flex; align-items:center; justify-content:center; gap:14px; margin:0 auto}
.flourish .line{height:1px; width:min(120px,22vw);
  background:linear-gradient(90deg,transparent,var(--gold-3))}
.flourish .line.r{background:linear-gradient(90deg,var(--gold-3),transparent)}
.flourish svg{width:26px; height:26px; opacity:.9}

/* ---------- Header ---------- */
header{
  position:sticky; top:0; z-index:40;
  background:rgba(10,10,13,.82); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
.nav{max-width:1200px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:18px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; margin-right:auto}
.brand .mark{width:34px; height:34px; flex:0 0 auto}
.brand .word{font-family:'Cinzel',serif; font-weight:600; font-size:1.5rem;
  letter-spacing:.06em; line-height:1}
.search{
  flex:1; min-width:0; max-width:360px; display:flex; align-items:center; gap:9px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px;
  padding:9px 15px; transition:border-color .2s;
}
.search:focus-within{border-color:var(--gold-3)}
.search input{flex:1; min-width:0; background:none; border:none; outline:none; color:var(--cream);
  font-size:.92rem}
.search input::placeholder{color:var(--muted-2)}
.search svg{width:17px; height:17px; stroke:var(--muted); flex:0 0 auto}
.cart-btn{position:relative; width:44px; height:44px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel); display:grid; place-items:center;
  transition:border-color .2s, background .2s}
.cart-btn:hover{border-color:var(--gold-3); background:var(--panel-2)}
.cart-btn svg{width:20px; height:20px; stroke:var(--gold-2)}
.cart-count{position:absolute; top:-6px; right:-6px; min-width:20px; height:20px;
  padding:0 5px; border-radius:999px; background:var(--gold-grad); color:#0a0a0d;
  font-size:.72rem; font-weight:600; display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* ---------- Hero ---------- */
.hero{max-width:1200px; margin:0 auto; padding:46px 20px 26px; text-align:center}
.hero h1{font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:clamp(2.1rem,6vw,3.4rem); line-height:1.05; letter-spacing:.01em; margin:16px 0 12px}
.hero p{color:var(--muted); font-weight:300; max-width:520px; margin:0 auto;
  font-size:1rem; line-height:1.6}

/* ---------- Filtros ---------- */
.filters{max-width:1200px; margin:0 auto; padding:18px 20px 6px;
  display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.chip{padding:8px 16px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); color:var(--muted); font-size:.85rem; letter-spacing:.02em;
  transition:.18s}
.chip:hover{color:var(--cream); border-color:var(--gold-deep)}
.chip.active{color:#0a0a0d; background:var(--gold-grad); border-color:transparent; font-weight:500}
.filters .count{margin-left:auto; color:var(--muted-2); font-size:.82rem}

/* ---------- Grid de productos ---------- */
.grid{max-width:1200px; margin:0 auto; padding:22px 20px 60px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:20px}
.card{position:relative; background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line-soft); border-radius:var(--radius-lg); overflow:hidden;
  text-align:left; transition:.25s; display:flex; flex-direction:column}
.card:hover{transform:translateY(-4px); border-color:var(--gold-deep);
  box-shadow:0 24px 50px rgba(0,0,0,.55)}
.card .imgwrap{aspect-ratio:1/1; background:
  radial-gradient(120px 120px at 50% 40%, #201c12 0%, transparent 70%), #0d0d11;
  display:grid; place-items:center; padding:22px}
.card .imgwrap img{max-height:100%; object-fit:contain;
  filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))}
.card .body{padding:14px 16px 18px; display:flex; flex-direction:column; gap:5px; flex:1}
.card .marca{font-size:.68rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold-3)}
.card .nombre{font-family:'Cormorant Garamond',serif; font-size:1.28rem; font-weight:600;
  line-height:1.12; color:var(--cream)}
.card .foot{margin-top:auto; padding-top:10px; display:flex; align-items:baseline;
  justify-content:space-between; gap:8px}
.card .precio{font-size:.95rem; color:var(--cream)}
.card .precio small{color:var(--muted); font-size:.72rem; letter-spacing:.04em}
.card .ver{font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-2)}
.badge-dest{position:absolute; top:12px; left:12px; z-index:2; font-size:.62rem;
  letter-spacing:.18em; text-transform:uppercase; padding:5px 9px; border-radius:999px;
  background:rgba(10,10,13,.7); border:1px solid var(--gold-deep); color:var(--gold-2)}

.state{grid-column:1/-1; text-align:center; color:var(--muted); padding:70px 20px}
.spinner{width:34px; height:34px; margin:0 auto 14px; border-radius:50%;
  border:2px solid var(--line); border-top-color:var(--gold-2); animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modal producto (estilo imagen 2) ---------- */
.overlay{position:fixed; inset:0; z-index:60; background:rgba(4,4,6,.72);
  backdrop-filter:blur(6px); display:none; align-items:flex-start; justify-content:center;
  overflow-y:auto; padding:24px 16px}
.overlay.open{display:flex}
.sheet{width:100%; max-width:560px; background:linear-gradient(180deg,var(--panel),var(--bg-2));
  border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
  overflow:hidden; animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0; transform:translateY(24px)}to{opacity:1; transform:none}}
.sheet .hd{position:relative; background:
  radial-gradient(220px 180px at 50% 35%,#221d11 0%,transparent 70%), #0e0e12;
  padding:34px 24px; display:grid; place-items:center}
.sheet .hd img{max-height:300px; object-fit:contain;
  filter:drop-shadow(0 22px 30px rgba(0,0,0,.6))}
.gallery{display:flex; gap:9px; justify-content:center; flex-wrap:wrap;
  padding:14px 20px 4px; background:#0e0e12}
.gthumb{width:56px; height:56px; border-radius:10px; overflow:hidden;
  border:1.5px solid var(--line); background:#14141b; padding:4px; transition:.15s}
.gthumb:hover{border-color:var(--gold-deep)}
.gthumb.active{border-color:var(--gold-2)}
.gthumb img{width:100%; height:100%; object-fit:contain}
.close{position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%;
  background:rgba(10,10,13,.6); border:1px solid var(--line); display:grid; place-items:center}
.close:hover{border-color:var(--gold-3)}
.close svg{width:16px; height:16px; stroke:var(--cream)}
.sheet .bd{padding:24px 24px 28px}
.sheet .marca{font-size:.72rem; letter-spacing:.28em; text-transform:uppercase; color:var(--gold-3); margin-bottom:6px}
.sheet h2{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:2rem;
  line-height:1.08; margin-bottom:4px}
.sheet .genero{color:var(--muted); font-size:.85rem; margin-bottom:20px}

.section-t{font-size:.7rem; letter-spacing:.28em; text-transform:uppercase; color:var(--muted);
  margin:22px 0 12px; display:flex; align-items:center; gap:10px}
.section-t::after{content:""; flex:1; height:1px; background:var(--line-soft)}

/* Notas como imágenes (estilo imagen 3) */
.notas-img{display:flex; gap:12px; flex-wrap:wrap}
.nota{width:78px; text-align:center}
.nota .ph{width:78px; height:78px; border-radius:14px; overflow:hidden; border:1px solid var(--line);
  background:var(--panel-2); display:grid; place-items:center}
.nota .ph img{width:100%; height:100%; object-fit:cover}
.nota .ph.empty{font-family:'Cormorant Garamond',serif; font-size:1.6rem; color:var(--gold-deep)}
.nota span{display:block; margin-top:7px; font-size:.74rem; color:var(--cream)}

/* Pirámide olfativa en texto */
.piramide{display:grid; gap:10px}
.piramide .row{display:grid; grid-template-columns:92px 1fr; gap:12px; align-items:baseline}
.piramide .k{font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-3)}
.piramide .v{color:var(--cream); font-weight:300; line-height:1.5; font-size:.92rem}

/* Perfil */
.perfil{display:flex; gap:10px; flex-wrap:wrap}
.perfil .p{flex:1; min-width:120px; background:var(--panel-2); border:1px solid var(--line-soft);
  border-radius:12px; padding:12px 14px}
.perfil .p .k{font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
.perfil .p .v{font-size:1.05rem; color:var(--cream); margin-top:3px}

/* Tamaños */
.tallas{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:10px}
.talla{background:var(--panel-2); border:1.5px solid var(--line); border-radius:12px;
  padding:14px 8px; text-align:center; transition:.18s}
.talla:hover{border-color:var(--gold-deep)}
.talla.sel{border-color:var(--gold-2); background:rgba(217,180,90,.08)}
.talla .ml{font-size:1.02rem; color:var(--cream); font-family:'Cormorant Garamond',serif; font-weight:600}
.talla .pr{font-size:.82rem; color:var(--gold-2); margin-top:3px}

.note-30{margin-top:14px; padding:12px 14px; border:1px dashed var(--line);
  border-radius:12px; color:var(--muted); font-size:.82rem; text-align:center}
.note-30 b{color:var(--gold-2)}

.add-cta{width:100%; margin-top:20px; padding:16px; border-radius:14px;
  background:var(--gold-grad); color:#0a0a0d; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; font-size:.82rem; transition:.18s;
  box-shadow:0 10px 30px rgba(201,154,62,.25)}
.add-cta:hover{filter:brightness(1.06); transform:translateY(-1px)}
.add-cta:disabled{background:var(--panel-2); color:var(--muted-2); box-shadow:none; cursor:not-allowed}

/* ---------- Carrito (drawer) ---------- */
.drawer{position:fixed; inset:0; z-index:70; display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute; inset:0; background:rgba(4,4,6,.6); backdrop-filter:blur(4px)}
.drawer .panel{position:absolute; top:0; right:0; height:100%; width:min(420px,100%);
  background:var(--bg-2); border-left:1px solid var(--line); display:flex; flex-direction:column;
  animation:slide .28s ease}
@keyframes slide{from{transform:translateX(30px); opacity:.6}to{transform:none; opacity:1}}
.drawer .top{padding:20px; border-bottom:1px solid var(--line-soft);
  display:flex; align-items:center; justify-content:space-between}
.drawer .top h3{font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:600}
.cart-list{flex:1; overflow-y:auto; padding:8px 20px}
.ci{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line-soft)}
.ci .th{width:60px; height:60px; border-radius:10px; background:#0d0d11; border:1px solid var(--line-soft);
  display:grid; place-items:center; flex:0 0 auto; overflow:hidden}
.ci .th img{max-width:100%; max-height:100%; object-fit:contain}
.ci .info{flex:1; min-width:0}
.ci .info .n{font-family:'Cormorant Garamond',serif; font-size:1.05rem; line-height:1.15}
.ci .info .m{font-size:.76rem; color:var(--muted)}
.ci .info .pr{color:var(--gold-2); font-size:.9rem; margin-top:2px}
.qty{display:flex; align-items:center; gap:8px; margin-top:6px}
.qty button{width:26px; height:26px; border-radius:7px; border:1px solid var(--line);
  background:var(--panel); display:grid; place-items:center; font-size:1rem; line-height:1; color:var(--cream)}
.qty button:hover{border-color:var(--gold-3)}
.qty .q{min-width:20px; text-align:center; font-size:.9rem}
.ci .rm{align-self:flex-start; color:var(--muted-2); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase}
.ci .rm:hover{color:var(--danger)}
.cart-empty{text-align:center; color:var(--muted); padding:60px 20px}
.drawer .bot{padding:20px; border-top:1px solid var(--line-soft)}
.tot{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px}
.tot .k{color:var(--muted); letter-spacing:.06em}
.tot .v{font-family:'Cormorant Garamond',serif; font-size:1.7rem; color:var(--cream)}
.wa{width:100%; padding:16px; border-radius:14px; background:#25d366; color:#062b14;
  font-weight:600; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; gap:9px;
  transition:.18s}
.wa:hover{filter:brightness(1.05)}
.wa svg{width:20px; height:20px; fill:#062b14}

/* ---------- Footer ---------- */
footer{border-top:1px solid var(--line-soft); padding:40px 20px; text-align:center; color:var(--muted-2)}
footer .word{font-family:'Cinzel',serif; font-size:1.15rem; letter-spacing:.08em; margin-bottom:8px}
footer a{color:var(--gold-3); text-decoration:none}

/* toast */
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--panel); border:1px solid var(--gold-deep); color:var(--cream);
  padding:13px 20px; border-radius:12px; font-size:.9rem; z-index:90; opacity:0;
  transition:.3s; box-shadow:var(--shadow); pointer-events:none}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ===== Mejoras: logo, tiktok, filtros, ofertas, envío ===== */
.hero-logo{max-width:520px; margin:0 auto}
.hero-logo img{width:100%; height:auto; filter:drop-shadow(0 22px 55px rgba(0,0,0,.6))}
.tt-btn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line);
  background:var(--panel); display:grid; place-items:center; transition:.2s; flex:0 0 auto}
.tt-btn:hover{border-color:var(--gold-3); background:var(--panel-2)}
.tt-btn svg{width:19px; height:19px; fill:var(--gold-2)}
.fgroup{display:flex; align-items:center; gap:8px; flex-wrap:wrap; width:100%}
.flabel{font-size:.64rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted-2);
  margin-right:4px; min-width:54px}
.fgroup .count{margin-left:auto; color:var(--muted-2); font-size:.82rem}
.badge-off{position:absolute; top:12px; right:12px; z-index:2; font-size:.66rem; letter-spacing:.06em;
  font-weight:600; padding:5px 9px; border-radius:999px; background:var(--gold-grad); color:#0a0a0d}
.talla{position:relative}
.talla .antes{color:var(--muted-2); text-decoration:line-through; font-size:.72rem; margin-right:5px}
.talla .off{position:absolute; top:-8px; right:-6px; font-size:.6rem; font-weight:700; padding:2px 6px;
  border-radius:999px; background:var(--gold-grad); color:#0a0a0d; box-shadow:0 3px 8px rgba(0,0,0,.4)}
.talla.oferta{border-color:var(--gold-deep)}
.catchip{display:inline-block; font-size:.6rem; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold-2); border:1px solid var(--gold-deep); border-radius:999px; padding:2px 9px; margin-left:4px;
  vertical-align:middle}
.envio{margin-top:16px; display:flex; align-items:center; gap:10px; justify-content:center; text-align:center;
  padding:13px 16px; border:1px solid var(--line); border-radius:12px;
  background:linear-gradient(180deg,var(--panel-2),transparent); color:var(--muted); font-size:.85rem}
.envio b{color:var(--gold-2); font-weight:600}
.envio svg{width:19px; height:19px; stroke:var(--gold-3); fill:none; stroke-width:1.6; flex:0 0 auto}
/* notas más compactas + perfil inline */
.nota{width:60px}
.nota .ph{width:60px; height:60px; border-radius:12px}
.nota span{font-size:.68rem; margin-top:6px}
.notas-img{gap:10px}
.perfil{display:flex; gap:8px; flex-wrap:wrap}
.perfil .p{flex:0 0 auto; min-width:0; display:flex; align-items:baseline; gap:7px; border-radius:999px; padding:7px 14px}
.perfil .p .k{font-size:.6rem}
.perfil .p .v{font-size:.92rem; margin-top:0}
.section-t{margin:18px 0 10px}
.filters{flex-direction:column; align-items:stretch; gap:12px}

@media(max-width:560px){
  .brand .word{font-size:1.25rem}
  .search{max-width:none}
  .hero{padding:34px 20px 18px}
}
</style>
</head>
<body>

<header>
  <nav class="nav">
    <a class="brand" href="#top">
      <svg class="mark" viewBox="0 0 40 40" fill="none">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f4e6b8"/><stop offset=".5" stop-color="#d9b45a"/>
          <stop offset="1" stop-color="#b8893a"/></linearGradient></defs>
        <path d="M20 6c2 2 3 3.5 1.5 5.5" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round"/>
        <rect x="17" y="11.5" width="6" height="4" rx="1" stroke="url(#g)" stroke-width="1.3"/>
        <path d="M15 17h10l1.5 9c.3 2-1 3.5-3 3.5h-8c-2 0-3.3-1.5-3-3.5L15 17z" stroke="url(#g)" stroke-width="1.4"/>
        <path d="M4 24h9M27 24h9" stroke="url(#g)" stroke-width="1" stroke-linecap="round"/>
      </svg>
      <span class="word gold-text">Aromelle</span>
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar perfume o marca…" autocomplete="off">
    </div>
    <a class="tt-btn" href="https://www.tiktok.com/@aromelle.decants?_r=1&_t=ZS-98hXj8YPyOy" target="_blank" rel="noopener" aria-label="TikTok">
      <svg viewBox="0 0 24 24"><path d="M16.5 3c.3 2.1 1.5 3.6 3.5 3.9v2.6c-1.3.1-2.5-.3-3.6-1v5.9c0 3.4-2.6 5.6-5.6 5.6-2.9 0-5.3-2.3-5.3-5.2 0-3.2 2.8-5.5 6-5.1v2.7c-.4-.1-.9-.2-1.3-.2-1.4 0-2.4 1-2.4 2.4 0 1.4 1.1 2.4 2.5 2.4 1.5 0 2.6-1.1 2.6-2.9V3h3.2z"/></svg>
    </a>
    <button class="cart-btn" id="openCart" aria-label="Carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-12z" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6 5 3H2" stroke-linecap="round"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      <span class="cart-count" id="cartCount" style="display:none">0</span>
    </button>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-logo">
      <img src="logo.png" alt="Aromelle"
        onerror="this.style.display='none';document.getElementById('heroFallback').style.display='block'">
    </div>
    <div id="heroFallback" style="display:none">
      <div class="flourish">
        <span class="line"></span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M2 12c4-4 6 4 10 0s6 4 10 0" stroke="#b8893a" stroke-width="1.2" stroke-linecap="round"/></svg>
        <span class="line r"></span>
      </div>
      <h1 style="margin-top:16px">Aromelle</h1>
    </div>
    <p style="margin-top:16px">Decants auténticos de perfumes árabes, de diseñador y nicho. Prueba antes de comprar el frasco completo.</p>
  </section>

  <div class="filters" id="filters"></div>
  <section class="grid" id="grid">
    <div class="state"><div class="spinner"></div>Cargando catálogo…</div>
  </section>
</main>

<footer>
  <div class="word gold-text">Aromelle</div>
  <p>Decants de perfumes · Envíos a todo el Perú</p>
  <p style="margin-top:10px; display:flex; gap:18px; justify-content:center; align-items:center">
    <a id="waFoot" href="#">WhatsApp</a>
    <a href="https://www.tiktok.com/@aromelle.decants?_r=1&_t=ZS-98hXj8YPyOy" target="_blank" rel="noopener">TikTok</a>
  </p>
</footer>

<!-- Modal producto -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- Carrito -->
<div class="drawer" id="drawer">
  <div class="scrim" data-close-cart></div>
  <div class="panel">
    <div class="top">
      <h3>Tu carrito</h3>
      <button class="close" data-close-cart aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="bot">
      <div class="tot"><span class="k">Total</span><span class="v" id="cartTotal">S/ 0.00</span></div>
      <button class="wa" id="waCheckout">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.1-.2 0-.4.1-.5l.4-.5c.1-.1.1-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.7.7-.9 1.6-.6 2.6.5 1.6 1.6 3 3.2 3.9 2 1.1 3.3 1 4.2.9.6-.1 1.4-.6 1.6-1.2.2-.5.2-1 .1-1.1z"/></svg>
        Pedir por WhatsApp
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   ⚙️  CONFIGURACIÓN — completa con tus datos de Supabase y WhatsApp
   ==================================================================== */
const SUPABASE_URL  = 'https://pyregonbsatplxgekymb.supabase.co';   // ← pega tu Project URL
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5cmVnb25ic2F0cGx4Z2VreW1iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMjU0MTUsImV4cCI6MjEwMTkwMTQxNX0.RcTf2YhayD8PoSxxcTY1F8qSOogvN4fwTzRRXmKhE2g';                        // ← pega tu anon public key
const WHATSAPP      = '51962367182';   // ← tu número con código de país (sin +)
const MONEDA        = 'S/';
const TIENDA        = 'Aromelle';
/* ==================================================================== */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $  = s => document.querySelector(s);
const fmt = n => MONEDA + ' ' + Number(n).toFixed(2);
function imgsOf(p){ const a = Array.isArray(p.imagenes)?p.imagenes.filter(Boolean):[]; return a.length?a:(p.imagen_url?[p.imagen_url]:[]); }
function presOf(p){ return Array.isArray(p.presentaciones)?p.presentaciones.filter(x=>x&&x.ml):[]; }
function preciosOf(p){ return presOf(p).map(x=>Number(x.precio)).filter(v=>!isNaN(v)); }
function ofertaPct(x){ const a=Number(x.antes), pr=Number(x.precio); return (a&&pr&&a>pr)?Math.round((a-pr)/a*100):0; }
function maxOferta(p){ const v=presOf(p).map(ofertaPct); return v.length?Math.max(...v):0; }
function catLabel(c){ return c==='Árabe'?'Perfume Árabe':c==='Nicho'?'Nicho':c==='Diseñador'?'Diseñador':(c||''); }

let PERFUMES = [], NOTAS_BY_PERFUME = {}, filterTipo = 'Todos', filterGenero = 'Todos', query = '';
let CART = JSON.parse(localStorage.getItem('aromelle_cart') || '[]');

/* ---------- Carga inicial ---------- */
async function load(){
  const { data: perfumes, error } = await sb.from('perfumes')
    .select('*').eq('activo', true).order('orden').order('created_at');
  if(error){ $('#grid').innerHTML = errState(error.message); return; }
  PERFUMES = perfumes || [];

  const ids = PERFUMES.map(p => p.id);
  if(ids.length){
    const { data: rel } = await sb.from('perfume_notas')
      .select('perfume_id, notas(nombre,imagen_url)').in('perfume_id', ids);
    (rel || []).forEach(r => {
      (NOTAS_BY_PERFUME[r.perfume_id] ||= []).push(r.notas);
    });
  }
  renderFilters(); render();
}

function errState(msg){
  return `<div class="state">No se pudo cargar el catálogo.<br>
    <small style="color:var(--muted-2)">${msg}</small><br><br>
    Revisa la configuración de Supabase en index.html.</div>`;
}

/* ---------- Filtros por Tipo y Género ---------- */
function renderFilters(){
  const cats = [['Todos','Todos'],['Árabes','Árabe'],['Diseñador','Diseñador'],['Nicho','Nicho']];
  const gens = ['Todos','Hombre','Mujer','Unisex'];
  $('#filters').innerHTML = `
    <div class="fgroup">
      <span class="flabel">Tipo</span>
      ${cats.map(([lab,val]) => `<button class="chip ${filterTipo===val?'active':''}" data-tipo="${val}">${lab}</button>`).join('')}
    </div>
    <div class="fgroup">
      <span class="flabel">Género</span>
      ${gens.map(g => `<button class="chip ${filterGenero===g?'active':''}" data-gen="${g}">${g}</button>`).join('')}
      <span class="count" id="fcount"></span>
    </div>`;
  document.querySelectorAll('[data-tipo]').forEach(c => c.onclick = () => { filterTipo = c.dataset.tipo; renderFilters(); render(); });
  document.querySelectorAll('[data-gen]').forEach(c => c.onclick = () => { filterGenero = c.dataset.gen; renderFilters(); render(); });
}

/* ---------- Render grid ---------- */
function precioDesde(p){ const v = preciosOf(p); return v.length ? Math.min(...v) : null; }
function render(){
  let list = PERFUMES.filter(p =>
    (filterTipo==='Todos'   || p.categoria===filterTipo) &&
    (filterGenero==='Todos' || p.genero===filterGenero) &&
    (!query || (p.nombre+' '+p.marca).toLowerCase().includes(query))
  );
  $('#fcount') && ($('#fcount').textContent = `${list.length} fragancia${list.length!==1?'s':''}`);
  if(!list.length){ $('#grid').innerHTML = `<div class="state">No encontramos fragancias con ese filtro.</div>`; return; }

  $('#grid').innerHTML = list.map(p => {
    const desde = precioDesde(p);
    const main = imgsOf(p)[0];
    const off = maxOferta(p);
    return `<button class="card" data-id="${p.id}">
      ${p.destacado ? '<span class="badge-dest">Destacado</span>' : ''}
      ${off ? `<span class="badge-off">−${off}%</span>` : ''}
      <div class="imgwrap">${main
        ? `<img src="${esc(main)}" alt="${esc(p.nombre)}" loading="lazy">`
        : `<span style="font-family:'Cormorant Garamond';font-size:2.4rem;color:var(--gold-deep)">${esc((p.marca||'A')[0])}</span>`}</div>
      <div class="body">
        <span class="marca">${esc(p.marca||'')}</span>
        <span class="nombre">${esc(p.nombre)}</span>
        <div class="foot">
          <span class="precio">${desde!=null?`<small>Desde</small> ${fmt(desde)}`:'<small>Consultar</small>'}</span>
          <span class="ver">Ver ›</span>
        </div>
      </div>
    </button>`;
  }).join('');
  document.querySelectorAll('.card').forEach(c =>
    c.onclick = () => openProduct(c.dataset.id));
}

/* ---------- Modal producto (estilo imagen 2 + notas imagen 3) ---------- */
let selSize = null, curProduct = null;
function openProduct(id){
  const p = PERFUMES.find(x => x.id === id); if(!p) return;
  curProduct = p; selSize = null;
  const notas = NOTAS_BY_PERFUME[id] || [];
  const imgs = imgsOf(p);
  const mainImg = imgs[0];
  const pres = presOf(p);
  const piramide = [['Salida',p.notas_salida],['Corazón',p.notas_corazon],['Fondo',p.notas_fondo]]
    .filter(([,v]) => v);

  $('#sheet').innerHTML = `
    <div class="hd">
      <button class="close" id="closeSheet" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      ${mainImg ? `<img id="mainImg" src="${esc(mainImg)}" alt="${esc(p.nombre)}">`
        : `<div style="font-family:'Cormorant Garamond';font-size:4rem;color:var(--gold-deep)">${esc(p.marca||'A')}</div>`}
    </div>
    ${imgs.length>1 ? `<div class="gallery">${imgs.map((u,i)=>
        `<button class="gthumb ${i===0?'active':''}" data-img="${esc(u)}"><img src="${esc(u)}" alt=""></button>`
      ).join('')}</div>` : ''}
    <div class="bd">
      <div class="marca">${esc(p.marca||'')}</div>
      <h2>${esc(p.nombre)}</h2>
      <div class="genero">${esc(p.genero||'')}${p.descripcion?' · '+esc(p.descripcion):''}${p.categoria?`<span class="catchip">${esc(catLabel(p.categoria))}</span>`:''}</div>

      ${notas.length ? `
        <div class="section-t">Notas aromáticas</div>
        <div class="notas-img">
          ${notas.map(n => `<div class="nota">
            <div class="ph ${n.imagen_url?'':'empty'}">
              ${n.imagen_url?`<img src="${n.imagen_url}" alt="${esc(n.nombre)}">`:esc((n.nombre||'?')[0])}
            </div>
            <span>${esc(n.nombre)}</span>
          </div>`).join('')}
        </div>` : ''}

      ${piramide.length ? `
        <div class="section-t">Pirámide olfativa</div>
        <div class="piramide">
          ${piramide.map(([k,v]) => `<div class="row"><div class="k">${k}</div><div class="v">${esc(v)}</div></div>`).join('')}
        </div>` : ''}

      ${(p.longevidad||p.estela) ? `
        <div class="section-t">Perfil</div>
        <div class="perfil">
          ${p.longevidad?`<div class="p"><div class="k">Duración</div><div class="v">${esc(p.longevidad)}</div></div>`:''}
          ${p.estela?`<div class="p"><div class="k">Estela</div><div class="v">${esc(p.estela)}</div></div>`:''}
        </div>` : ''}

      <div class="section-t">Seleccionar tamaño</div>
      <div class="tallas" id="tallas">
        ${pres.length ? pres.map(x => {
          const pct = ofertaPct(x);
          return `<button class="talla ${pct?'oferta':''}" data-size="${esc(x.ml)}" data-price="${Number(x.precio)}">
            ${pct?`<div class="off">−${pct}%</div>`:''}
            <div class="ml">${esc(x.ml)}</div>
            <div class="pr">${pct?`<span class="antes">${fmt(x.antes)}</span>`:''}${fmt(x.precio)}</div>
          </button>`;
        }).join('') : '<div class="v" style="color:var(--muted)">Precios a consultar por WhatsApp.</div>'}
      </div>
      <div class="envio">
        <svg viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7z" stroke-linejoin="round"/><circle cx="7" cy="17" r="1.6"/><circle cx="17" cy="17" r="1.6"/></svg>
        <span>Envíos a todo el Perú por <b>Shalom</b> · costo adicional <b>S/ 2</b></span>
      </div>

      <button class="add-cta" id="addBtn" disabled>Elige un tamaño</button>
    </div>`;

  document.querySelectorAll('#tallas .talla').forEach(t => t.onclick = () => {
    document.querySelectorAll('#tallas .talla').forEach(x => x.classList.remove('sel'));
    t.classList.add('sel');
    selSize = { size:t.dataset.size, price:+t.dataset.price };
    const b = $('#addBtn'); b.disabled = false;
    b.textContent = `Añadir · ${t.dataset.size} · ${fmt(t.dataset.price)}`;
  });
  document.querySelectorAll('.gthumb').forEach(t => t.onclick = () => {
    const m = $('#mainImg'); if(m) m.src = t.dataset.img;
    document.querySelectorAll('.gthumb').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
  });
  $('#addBtn').onclick = addToCart;
  $('#closeSheet').onclick = closeProduct;
  $('#overlay').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeProduct(){ $('#overlay').classList.remove('open'); document.body.style.overflow=''; }
$('#overlay').onclick = e => { if(e.target.id==='overlay') closeProduct(); };

/* ---------- Carrito ---------- */
function addToCart(){
  if(!curProduct || !selSize) return;
  const key = curProduct.id + '_' + selSize.size;
  const found = CART.find(i => i.key === key);
  if(found) found.qty++;
  else CART.push({ key, id:curProduct.id, nombre:curProduct.nombre, marca:curProduct.marca,
    img:imgsOf(curProduct)[0], size:selSize.size, price:selSize.price, qty:1 });
  saveCart(); toast(`Añadido: ${curProduct.nombre} (${selSize.size})`);
  closeProduct(); openCart();
}
function saveCart(){ localStorage.setItem('aromelle_cart', JSON.stringify(CART)); renderCart(); }
function renderCart(){
  const n = CART.reduce((s,i) => s+i.qty, 0);
  const cc = $('#cartCount'); cc.textContent = n; cc.style.display = n?'grid':'none';
  const total = CART.reduce((s,i) => s + i.price*i.qty, 0);
  $('#cartTotal').textContent = fmt(total);
  $('#cartList').innerHTML = CART.length ? CART.map(i => `
    <div class="ci">
      <div class="th">${i.img?`<img src="${i.img}" alt="">`:''}</div>
      <div class="info">
        <div class="n">${esc(i.nombre)}</div>
        <div class="m">${esc(i.marca||'')} · ${i.size}</div>
        <div class="pr">${fmt(i.price)}</div>
        <div class="qty">
          <button data-dec="${i.key}">−</button>
          <span class="q">${i.qty}</span>
          <button data-inc="${i.key}">+</button>
        </div>
      </div>
      <button class="rm" data-rm="${i.key}">Quitar</button>
    </div>`).join('') : `<div class="cart-empty">Tu carrito está vacío.<br>Añade tus fragancias favoritas.</div>`;

  $('#cartList').querySelectorAll('[data-inc]').forEach(b => b.onclick=()=>chgQty(b.dataset.inc,1));
  $('#cartList').querySelectorAll('[data-dec]').forEach(b => b.onclick=()=>chgQty(b.dataset.dec,-1));
  $('#cartList').querySelectorAll('[data-rm]').forEach(b => b.onclick=()=>{ CART=CART.filter(i=>i.key!==b.dataset.rm); saveCart(); });
}
function chgQty(key,d){ const i=CART.find(x=>x.key===key); if(!i)return; i.qty+=d; if(i.qty<1)CART=CART.filter(x=>x.key!==key); saveCart(); }
function openCart(){ renderCart(); $('#drawer').classList.add('open'); document.body.style.overflow='hidden'; }
function closeCart(){ $('#drawer').classList.remove('open'); document.body.style.overflow=''; }
$('#openCart').onclick = openCart;
document.querySelectorAll('[data-close-cart]').forEach(el => el.onclick = closeCart);

$('#waCheckout').onclick = () => {
  if(!CART.length){ toast('Tu carrito está vacío'); return; }
  let msg = `¡Hola ${TIENDA}! 🌿 Quiero hacer este pedido:%0A%0A`;
  CART.forEach(i => msg += `• ${i.nombre} (${i.marca||''}) — ${i.size} x${i.qty} = ${fmt(i.price*i.qty)}%0A`);
  const total = CART.reduce((s,i)=>s+i.price*i.qty,0);
  msg += `%0A*Total: ${fmt(total)}*`;
  window.open(`https://wa.me/${WHATSAPP}?text=${msg}`, '_blank');
};
$('#waFoot').href = `https://wa.me/${WHATSAPP}`;

/* ---------- Buscador ---------- */
$('#q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };

/* ---------- Utilidades ---------- */
function esc(s){ return String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2400); }
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeProduct(); closeCart(); } });

renderCart();
load();
</script>
</body>
</html>
